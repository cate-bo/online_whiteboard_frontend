[package]
name = "online_whiteboard_frontend"
version = "0.1.0"
edition = "2024"
include = ["**/*.rs", "Cargo.toml"]

[dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }
uuid = { version = "1.23.4", default-features = false, features = ["default", "js"] }
borrow = "2.0.0"
clone = "0.1.2"
eframe = "0.34.3"
egui = "0.34.3"
egui-async = "0.4.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.150"
signalr-client = "0.3.2"
tokio = { version = "1.52.3", features = ["sync","macros","io-util","rt","time"] }
log = "0.4.33"

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"
ureq = { version = "2.0.0", features = ["tls","native-certs"] }     # to make signalr accept Unknownissuer ssl certificate

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"              # to access the DOM (to hide the loading text)
