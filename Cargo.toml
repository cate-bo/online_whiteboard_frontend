[package]
name = "online_whiteboard_frontend"
version = "0.1.0"
edition = "2024"
include = ["**/*.rs", "Cargo.toml"]

[dependencies]
borrow = "2.0.0"
clone = "0.1.2"
eframe = "0.34.3"
egui = "0.34.3"
egui-async = "0.4.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = "1.0.228"
serde_json = "1.0.150"
signalr-client = "0.3.2"
signalrs-client = "0.1.1"
tokio = { version = "1.52.3", features = ["sync","macros","io-util","rt","time"] }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.8"

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4.50"
web-sys = "0.3.70"              # to access the DOM (to hide the loading text)
